# nginx in front of both servers. PORT_HERE is replaced by launch.sh
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  absolute_redirect off;
  client_body_temp_path /tmp/nginx_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_read_timeout 60s;

  # CORS for the two static sites (fraud-management-nikitha, product-order-management-abhay)
  map_hash_bucket_size 128;
  map $http_origin $cors_origin {
    default "";
    "https://fraud-management-nikitha.onrender.com"       $http_origin;
    "https://product-order-management-abhay.onrender.com" $http_origin;
  }
  # the java servers add their own CORS headers, hide them so they are not sent twice
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;

  server {
    listen PORT_HERE default_server;

    # /orders/ -> ShopServer, everything else -> GuardServer
    location = /orders { return 301 /orders/; }

    location /orders/api/ {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Max-Age 600 always;
      add_header Vary Origin always;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://127.0.0.1:8082/api/;
    }
    location /orders/ { proxy_pass http://127.0.0.1:8082/; }

    location /api/ {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Max-Age 600 always;
      add_header Vary Origin always;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://127.0.0.1:8081;
    }
    location / { proxy_pass http://127.0.0.1:8081; }
  }
}
